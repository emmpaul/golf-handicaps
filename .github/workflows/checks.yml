# Contrôles communs aux PR et à main (design, décisions 7, 8 et 10 ; improve-ci-pipeline, décisions 1 à 3 ;
# rationalize-ci-runs, décisions 3 à 6).
# Le job scope décide si le code doit être vérifié. Sur une PR, il classe les fichiers modifiés : pour de la
# documentation seule (dont la PR de release), quality ne garde que check:pins, commitlint et le lint, et les
# e2e et le build Docker sont sautés. Sur un push main, le classement ne joue plus : les mêmes jobs ne sont
# sautés que si l'arbre poussé a déjà été vérifié par sa PR (exécution pr réussie sur le dernier commit de la
# PR, même arbre, PR à jour du commit précédent de main) ; sinon la suite complète tourne.
# Les e2e partagent un seul build de l'app (e2e-build) et tournent en trois tranches (une pour les tests tagués
# @ocr, deux pour le reste) ; l'agrégateur e2e porte le contrôle requis `checks / e2e`.
# Le job docker tourne si l'appelant passe `docker: true` (PR et main).
name: checks

on:
  workflow_call:
    inputs:
      commit-from:
        description: Premier commit exclu de la plage vérifiée par commitlint (vide = dernier commit seul)
        required: false
        default: ""
        type: string
      commit-to:
        description: Dernier commit de la plage vérifiée par commitlint
        required: true
        type: string
      docker:
        description: Build de l'image sans push et test de fumée compose
        required: false
        default: false
        type: boolean

# Pas de permissions au niveau du workflow : elles plafonneraient celles de l'appelant pour tous les jobs.
# Chaque job déclare `contents: read`, sauf scope, qui hérite de l'appelant : `contents: read` depuis pr.yml ;
# `contents: read`, `actions: read` (exécution pr du dernier commit de la PR) et `pull-requests: read` (PR
# associée au commit poussé) depuis main.yml. Un job appelé qui demande `actions: read` ou `pull-requests: read`
# ferait échouer pr.yml au démarrage, puisque pr.yml ne les accorde pas.

env:
  IMAGE: golf-handicaps:ci

jobs:
  # Sortie `code` : `false` pour de la documentation seule (PR) ou un arbre déjà vérifié par sa PR (push main),
  # `true` sinon. Les jobs testent `code != 'false'` :
  # si scope échoue, la sortie est vide et tout tourne (repli sur la suite complète).
  scope:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Node de .nvmrc (24) pour lancer le script TypeScript sans dépendances ; pas de pnpm ni d'install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Classement des fichiers modifiés
        id: scope
        env:
          FROM: ${{ inputs.commit-from }}
          TO: ${{ inputs.commit-to }}
          # Dans un workflow appelé, l'événement est celui de l'appelant (pull_request ou push).
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$FROM" ]; then
            echo "commit-from vide (premier push) : suite complète"
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          paths="$RUNNER_TEMP/changed-paths.txt"
          git diff --name-only "$FROM" "$TO" > "$paths"
          echo "Fichiers modifiés :"
          cat "$paths"
          args=(--event "$EVENT")
          # Un package.json absent d'un côté n'est pas un simple bump : sans les deux fichiers, la suite complète tourne.
          if grep -qx 'package.json' "$paths" \
            && git show "$FROM:package.json" > "$RUNNER_TEMP/package-before.json" \
            && git show "$TO:package.json" > "$RUNNER_TEMP/package-after.json"; then
            args+=(--package-before "$RUNNER_TEMP/package-before.json" --package-after "$RUNNER_TEMP/package-after.json")
          fi
          # Sur main (rationalize-ci-runs, décision 3) : le push n'est sauté que si l'arbre a déjà été vérifié
          # par sa PR. Quatre lectures, journalisées sur stderr (stdout ne porte que le JSON) ; toute erreur
          # de lecture rend 1 et laisse --verified-by-pr absent, donc la suite complète. Chaque commande est
          # gardée explicitement : set -e ne s'applique pas dans une fonction appelée depuis un `if`.
          verified_by_pr() {
            local pr_line pr head conclusion to_tree head_tree same_tree contains status
            # 1. PR associée : la première dont merged_at est renseigné.
            pr_line=$(gh api "repos/$GH_REPO/commits/$TO/pulls" \
              --jq 'first(.[] | select(.merged_at != null)) | "\(.number) \(.head.sha)"') || {
              echo "Lecture de la PR associée à $TO impossible" >&2; return 1; }
            if [ -z "$pr_line" ]; then echo "Aucune PR fusionnée associée à $TO" >&2; return 1; fi
            read -r pr head <<< "$pr_line"
            echo "PR associée à $TO : #$pr, dernier commit $head" >&2
            # 2. Conclusion de la dernière exécution pr sur ce commit.
            conclusion=$(gh run list --workflow pr.yml --commit "$head" --json conclusion \
              --jq '.[0].conclusion // ""') || {
              echo "Lecture de l'exécution pr de $head impossible" >&2; return 1; }
            echo "Conclusion de l'exécution pr de $head : ${conclusion:-(aucune)}" >&2
            # Le commit de la PR manque au checkout si sa branche a été supprimée : on le récupère par SHA.
            if ! git cat-file -e "$head^{commit}" 2>/dev/null; then
              git fetch --no-tags --quiet origin "$head" || {
                echo "Commit $head introuvable sur origin" >&2; return 1; }
            fi
            # 3. Arbres du commit poussé et du dernier commit de la PR.
            to_tree=$(git rev-parse "$TO^{tree}") || { echo "Arbre de $TO illisible" >&2; return 1; }
            head_tree=$(git rev-parse "$head^{tree}") || { echo "Arbre de $head illisible" >&2; return 1; }
            if [ "$to_tree" = "$head_tree" ]; then same_tree=true; else same_tree=false; fi
            echo "Arbre de $TO : $to_tree ; arbre de $head : $head_tree ; identiques : $same_tree" >&2
            # 4. La PR contenait le commit précédent de main (code 1 : non ; autre code : erreur).
            status=0
            git merge-base --is-ancestor "$FROM" "$head" || status=$?
            case "$status" in
              0) contains=true ;;
              1) contains=false ;;
              *) echo "merge-base --is-ancestor $FROM $head en erreur ($status)" >&2; return 1 ;;
            esac
            echo "$head contient le commit précédent de main $FROM : $contains" >&2
            jq -cn --argjson pr "$pr" --arg headSha "$head" --arg runConclusion "$conclusion" \
              --argjson sameTree "$same_tree" --argjson headContainsBefore "$contains" \
              '{pr: $pr, headSha: $headSha, runConclusion: $runConclusion, sameTree: $sameTree, headContainsBefore: $headContainsBefore}'
          }
          if [ "$EVENT" = "push" ]; then
            if verified=$(verified_by_pr) && [ -n "$verified" ]; then
              echo "Lectures passées à ci-scope : $verified"
              args+=(--verified-by-pr "$verified")
            else
              echo "Lectures incomplètes : --verified-by-pr absent, suite complète"
            fi
          fi
          node scripts/ci-scope.ts "${args[@]}" < "$paths" | tee -a "$GITHUB_OUTPUT"

  # Toujours lancé (même si scope échoue) : check:pins, commitlint et le lint passent sur toute PR.
  quality:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Tesseract (tests OCR)
        if: needs.scope.outputs.code != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          tesseract --version
      - name: Versions exactes
        run: pnpm check:pins
      - name: Commitlint
        env:
          FROM: ${{ inputs.commit-from }}
          TO: ${{ inputs.commit-to }}
        run: |
          if [ -n "$FROM" ]; then
            pnpm exec commitlint --verbose --from "$FROM" --to "$TO"
          else
            pnpm exec commitlint --verbose --last
          fi
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        if: needs.scope.outputs.code != 'false'
        run: pnpm typecheck
      - name: Tests unitaires
        if: needs.scope.outputs.code != 'false'
        run: pnpm test
      - name: Duplication (jscpd 0 %)
        if: needs.scope.outputs.code != 'false'
        run: pnpm jscpd

  # Un seul build Next pour toutes les tranches (rationalize-ci-runs, décision 5). L'archive tar garde les liens
  # symboliques de .next/node_modules (paquets externes better-sqlite3 et sharp, relatifs à node_modules/.pnpm,
  # identique d'une machine à l'autre pour un même lockfile) ; upload-artifact les suivrait et copierait les
  # paquets hors de pnpm, où leurs dépendances natives ne se résolvent plus. Ni cache ni dev (inutiles à
  # `next start`), ni standalone (sortie de l'image Docker et du worker esbuild : les tranches lancent
  # `next start` et le worker par tsx depuis les sources).
  e2e-build:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build de l'app
        run: pnpm build
      - name: Archive de .next
        run: tar -cf "$RUNNER_TEMP/next-build.tar" --exclude=.next/cache --exclude=.next/dev --exclude=.next/standalone .next
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: ${{ runner.temp }}/next-build.tar
          if-no-files-found: error
          retention-days: 1

  # Une machine par tranche : chacune lance son serveur (sur le build de e2e-build), son worker et sa base
  # (workers: 1). Sans build réussi, les tranches ne tournent pas et e2e échoue.
  # --shard coupe la liste par nombre de tests, en blocs contigus : les tests lents qui attendent l'OCR
  # tombaient ensemble dans la même tranche. Une partie d'entre eux porte le tag @ocr (OCR_SHARD dans
  # tests/e2e/fixtures.ts) et tourne seule ; le reste (--grep-invert) se coupe en deux. Chaque test tombe
  # dans une seule tranche (rationalize-ci-runs, décision 6).
  e2e-shard:
    # Noms courts : `e2e-shard (ocr)`, `e2e-shard (1)`, `e2e-shard (2)` (sans les arguments de la matrice).
    name: e2e-shard (${{ matrix.shard }})
    needs: [scope, e2e-build]
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' && needs.e2e-build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ocr
            args: --grep @ocr
          - shard: 1
            args: --grep-invert @ocr --shard=1/2
          - shard: 2
            args: --grep-invert @ocr --shard=2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Tesseract (worker)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
      # Les tests WebKit iPhone peuvent tomber dans n'importe quelle tranche : les deux navigateurs partout.
      - name: Navigateurs Playwright
        run: pnpm exec playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: ${{ runner.temp }}
      - name: Build de l'app (artefact)
        run: tar -xf "$RUNNER_TEMP/next-build.tar"
      # E2E_PREBUILT=1 : playwright.config.ts lance `pnpm start` sans `pnpm build`.
      - name: Tests e2e
        env:
          E2E_PREBUILT: "1"
        run: pnpm e2e ${{ matrix.args }}
      # Durée de chaque test de la tranche (reporter json, rationalize-ci-runs, décision 6).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-durations-${{ matrix.shard }}
          path: playwright-durations.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Contrôle requis `checks / e2e` : vert seulement si scope, le build et toutes les tranches ont réussi,
  # sauté (donc compté réussi) quand le code n'est pas à vérifier.
  e2e:
    needs: [scope, e2e-build, e2e-shard]
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Résultat du build et des tranches
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BUILD_RESULT: ${{ needs.e2e-build.result }}
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "scope : $SCOPE_RESULT ; e2e-build : $BUILD_RESULT ; e2e-shard : $SHARDS_RESULT"
          [ "$SCOPE_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ] && [ "$SHARDS_RESULT" = "success" ]

  # Build de l'image et test de fumée avant la fusion (rationalize-ci-runs, décision 4), en parallèle des e2e.
  docker:
    needs: scope
    if: ${{ !cancelled() && inputs.docker && needs.scope.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Pas d'artefact *.dockerbuild gardé 90 jours ; le résumé de build reste.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          # Sha inscrit dans l'image, relu par le test de fumée (tests/compose/version.spec.ts). Sur une PR,
          # github.sha est le commit de fusion : EXPECTED_COMMIT ci-dessous porte la même valeur.
          build-args: GIT_COMMIT=${{ github.sha }}
          # Un cache gha écrit par une PR n'est lisible que par elle et sa branche de base : golf-handicaps-amd64,
          # écrit sur main par publish-image à chaque release, fait démarrer chaud une nouvelle PR.
          cache-from: |
            type=gha,scope=golf-handicaps
            type=gha,scope=golf-handicaps-amd64
          cache-to: type=gha,mode=max,scope=golf-handicaps
      - name: Aucune fixture ni secret dans l'image
        run: |
          docker run --rm "$IMAGE" ls -A /app
          docker run --rm "$IMAGE" sh -c '! find /app -path /app/node_modules -prune -o \( -name tests -o -name fixtures -o -name ".env*" -o -name "*.jpg" \) -print | grep .'
      - uses: ./.github/actions/setup
      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Test de fumée compose
        env:
          GOLF_IMAGE: ${{ env.IMAGE }}
          GOLF_ENV_FILE: ${{ runner.temp }}/smoke.env
          APP_PASSCODE: ci-code-du-groupe
          SESSION_SECRET: ci-secret-de-session-de-32-caracteres-min
          # Joueurs de la carte de référence, attendus par tests/compose/compose.spec.ts (Gab 72, Manu 88).
          INITIAL_PLAYERS: Manu,Gab,Sean
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          # SGT_LOOKUP=off : le worker de la CI n'appelle jamais Simulator Golf Tour.
          printf 'APP_PASSCODE=%s\nSESSION_SECRET=%s\nINITIAL_PLAYERS=%s\nSGT_LOOKUP=off\n' "$APP_PASSCODE" "$SESSION_SECRET" "$INITIAL_PLAYERS" > "$GOLF_ENV_FILE"
          docker compose up --no-build --wait
          pnpm e2e:compose
      - name: Logs compose
        if: failure()
        env:
          GOLF_IMAGE: ${{ env.IMAGE }}
          GOLF_ENV_FILE: ${{ runner.temp }}/smoke.env
        run: |
          touch "$GOLF_ENV_FILE"
          docker compose logs --no-color
      - name: Arrêt compose
        if: always()
        env:
          GOLF_IMAGE: ${{ env.IMAGE }}
          GOLF_ENV_FILE: ${{ runner.temp }}/smoke.env
        run: |
          touch "$GOLF_ENV_FILE"
          docker compose down -v
