# main : contrôles des PR plus build Docker et test de fumée compose, puis release-please (PR de release, CHANGELOG.md, tag vX.Y.Z).
# Un push de documentation seule, dont la fusion de la PR de release, saute les e2e et le build Docker
# si l'exécution main du commit parent a réussi (improve-ci-pipeline, décision 2).
# Seulement quand une release est créée : image multi-arch publiée sur GHCR
# (ghcr.io/<owner>/golf-handicaps:{vX.Y.Z,latest,sha}), chaque architecture construite sur un runner natif
# puis réunie dans un index. Déploiement manuel dans Dokploy (design, décision 7).
name: main

on:
  push:
    branches: [main]

permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/golf-handicaps
  IMAGE_TITLE: golf-handicaps
  IMAGE_DESCRIPTION: "Handicaps simulateur de golf : import de cartes GSPro, index et coups à donner"

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    # actions: read pour le job scope, qui lit la conclusion de l'exécution main du commit parent.
    permissions:
      contents: read
      actions: read
    with:
      # Premier push d'une branche : `before` vaut 000…0, on ne vérifie que le dernier commit.
      commit-from: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
      commit-to: ${{ github.sha }}
      docker: true

  release-please:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # PR de release ouverte avec un PAT pour déclencher les contrôles requis sur main.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Les releases créées avec GITHUB_TOKEN ne déclenchent pas d'autre workflow : l'image se construit ici.
  # Une architecture par runner natif, poussée par digest seulement (schéma Docker « distribute build across multiple runners »).
  publish-image:
    needs: [checks, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Labels et annotations OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          annotations: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
      - name: Build ${{ matrix.platform }} et push par digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Pas d'artefact *.dockerbuild gardé 90 jours ; le résumé de build reste.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # Le cache golf-handicaps vient du job docker de checks (amd64) ; chaque architecture garde le sien.
          cache-from: |
            type=gha,scope=golf-handicaps-${{ matrix.arch }}
            type=gha,scope=golf-handicaps
          cache-to: type=gha,mode=max,scope=golf-handicaps-${{ matrix.arch }}
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Index multi-arch sous les tags vX.Y.Z, latest et sha, avec les annotations OCI au niveau de l'index.
  publish-manifest:
    needs: [release-please, publish-image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags et annotations OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
      # Tableau bash : la description contient des espaces, chaque tag et annotation reste un seul argument.
      - name: Index multi-arch et push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE_NAME@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Inspection
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: docker buildx imagetools inspect "$IMAGE_NAME:$TAG"
