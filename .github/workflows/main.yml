# main : contrôles des PR plus build Docker et test de fumée compose, puis release-please (PR de release, CHANGELOG.md, tag vX.Y.Z).
# Seulement quand une release est créée : image multi-arch publiée sur GHCR
# (ghcr.io/<owner>/golf-handicaps:{vX.Y.Z,latest,sha}). Déploiement manuel dans Dokploy (design, décision 7).
name: main

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      # Premier push d'une branche : `before` vaut 000…0, on ne vérifie que le dernier commit.
      commit-from: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
      commit-to: ${{ github.sha }}
      docker: true

  release-please:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Les releases créées avec GITHUB_TOKEN ne déclenchent pas d'autre workflow : l'image se construit ici.
  publish:
    needs: [checks, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags et labels OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/golf-handicaps
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=golf-handicaps
            org.opencontainers.image.description=Handicaps simulateur de golf : import de cartes GSPro, index et coups à donner
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          annotations: |
            org.opencontainers.image.title=golf-handicaps
            org.opencontainers.image.description=Handicaps simulateur de golf : import de cartes GSPro, index et coups à donner
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
      - name: Build multi-arch et push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=gha,scope=golf-handicaps-multiarch
            type=gha,scope=golf-handicaps
          cache-to: type=gha,mode=max,scope=golf-handicaps-multiarch
