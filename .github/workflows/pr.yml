# PR : lint, typecheck, tests, e2e, jscpd, check:pins et commitlint sur les commits de la PR.
# Pas de build Docker : il tourne sur main, avant release-please (design, décision 7).
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      commit-from: ${{ github.event.pull_request.base.sha }}
      commit-to: ${{ github.event.pull_request.head.sha }}
